# Component catalog: canonical service name -> draw.io AWS4 icon.  Loaded by app/catalog/loader.py.
#
# Entry fields
#   name      canonical name (what the Extractor puts in `service`)
#   shape     AWS4 shape name (after mxgraph.aws4.); must exist in vendor aws4-shapes.json
#   style     resource_icon : main service icon, drawn shape=mxgraph.aws4.resourceIcon;resIcon=mxgraph.aws4.<shape>
#             sub_resource  : stencil icon, drawn shape=mxgraph.aws4.<shape>
#             general       : non-AWS glyph (listed under sub_resources in the JSON) drawn with resIcon, as the skill does
#   category  key of the `categories` table below (visual category: label + fill + container tint/stroke)
#   kind      default ComponentKind
#   synonyms  lowercase aliases; unique across the whole file after normalisation
#   exact     true = the keys only match the whole text (never as a word inside a longer phrase)
#
# COLOURS: these rows must agree with vendor/deploy-on-aws-plugin/scripts/lib/fix_icon_colors.py, which
# overwrites icon fills and container tint/stroke for the shapes in its tables. tests/test_catalog.py
# cross-checks them. Where the fixer differs from aws4-shapes.json (iot, developer_tools, API Gateway,
# Elastic Load Balancing as networking, management tint) the fixer wins.

categories:
  compute:                    {label: Compute,                fill_color: "#ED7100", tint_color: "#FFF2E8", stroke_color: "#ED7100"}
  containers:                 {label: Containers,             fill_color: "#ED7100", tint_color: "#FFF2E8", stroke_color: "#ED7100"}
  database:                   {label: Database,               fill_color: "#C925D1", tint_color: "#F5E6F7", stroke_color: "#C925D1"}
  storage:                    {label: Storage,                fill_color: "#3F8624", tint_color: "#E8F5E9", stroke_color: "#3F8624"}
  analytics:                  {label: Analytics,              fill_color: "#8C4FFF", tint_color: "#EDE7F6", stroke_color: "#8C4FFF"}
  networking:                 {label: Networking,             fill_color: "#8C4FFF", tint_color: "#EDE7F6", stroke_color: "#8C4FFF"}
  application_integration:    {label: App Integration,        fill_color: "#E7157B", tint_color: "#FCE4EC", stroke_color: "#E7157B"}
  security:                   {label: Security,               fill_color: "#DD344C", tint_color: "#FFEBEE", stroke_color: "#DD344C"}
  ai_ml:                      {label: AI/ML,                  fill_color: "#01A88D", tint_color: "#E0F2F1", stroke_color: "#01A88D"}
  iot:                        {label: IoT,                    fill_color: "#1A9C37", tint_color: "#E8F5E9", stroke_color: "#1A9C37"}
  management_governance:      {label: Management,             fill_color: "#E7157B", tint_color: "#FCE4EC", stroke_color: "#E7157B"}
  developer_tools:            {label: Developer Tools,        fill_color: "#8C4FFF", tint_color: "#EDE7F6", stroke_color: "#8C4FFF"}
  migration_modernization:    {label: Migration,              fill_color: "#3F8624", tint_color: "#E8F5E9", stroke_color: "#3F8624"}
  cloud_financial_management: {label: Cost Management,        fill_color: "#3F8624", tint_color: "#E8F5E9", stroke_color: "#3F8624"}
  business_applications:      {label: Business Applications,  fill_color: "#E7157B", tint_color: "#FCE4EC", stroke_color: "#E7157B"}
  front_end_web_mobile:       {label: Front-End Web and Mobile, fill_color: "#E7157B", tint_color: "#FCE4EC", stroke_color: "#E7157B"}
  end_user_computing:         {label: End User Computing,     fill_color: "#ED7100", tint_color: "#FFF2E8", stroke_color: "#ED7100"}
  media_services:             {label: Media Services,         fill_color: "#ED7100", tint_color: "#FFF2E8", stroke_color: "#ED7100"}
  general:                    {label: General,                fill_color: "#232F3D", tint_color: "#F5F5F5", stroke_color: "#666666"}

# Used by Catalog.resolve() when nothing matches (the result has matched=False). Values are entry names below.
