[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "architecture-agent-strands"
version = "0.3.0"
description = "Architecture Agent: SRS -> ADR + spec.json + usage.json -> AWS architecture diagram, on Strands Agents, deployed to Amazon Bedrock AgentCore"
requires-python = ">=3.11"
dependencies = [
  "strands-agents>=1.61,<2",
  "bedrock-agentcore>=1.24,<2",
  "pydantic>=2.5",
  "pydantic-settings>=2.2",
  "boto3>=1.34",
  "pdfplumber>=0.11",
  "pypdf>=4.0",
  "python-docx>=1.1",
  "defusedxml>=0.7.1",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["architecture_agent*", "adr_generator*", "diagram_generator*", "usage_estimator*"]

[tool.setuptools.package-data]
adr_generator = ["prompts/*.md"]
diagram_generator = ["prompts/*.md", "catalog/*.yaml", "render/*.mjs"]
usage_estimator = ["prompts/*.md", "expectedOutput.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
