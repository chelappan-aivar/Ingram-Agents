[project]
name = "intake-agent"
version = "0.1.0"
description = "Project Catalyst Intake agent: pulls Outlook mail via Microsoft Graph"
authors = [
    { name = "chelappan-aivar", email = "chelappan.kumar@aivar.tech" }
]
requires-python = ">=3.12"
dependencies = [
    "msal==1.39.0",
    "python-dotenv==1.2.4",
    "requests==2.34.2",
]

[project.scripts]
fetch-mail = "intake.cli:main"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "intake"
